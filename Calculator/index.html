<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Calc - Advanced Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="brand">
                <span class="logo-icon">🔮</span>
                <h2>Quantum</h2>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-btn active" id="tab-standard" onclick="switchMode('standard')">
                    <span class="icon">🔢</span> <span class="lbl" data-en="Standard" data-hi="साधारण">Standard</span>
                </button>
                <button class="nav-btn" id="tab-scientific" onclick="switchMode('scientific')">
                    <span class="icon">🔬</span> <span class="lbl" data-en="Scientific" data-hi="वैज्ञानिक">Scientific</span>
                </button>
                <button class="nav-btn" id="tab-unit" onclick="switchMode('unit')">
                    <span class="icon">📐</span> <span class="lbl" data-en="Converter" data-hi="परिवर्तक">Converter</span>
                </button>
                <button class="nav-btn" id="tab-history" onclick="switchMode('history')">
                    <span class="icon">🕒</span> <span class="lbl" data-en="History" data-hi="इतिहास">History</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="setting-row">
                    <span>🌍</span>
                    <select id="languageSelect" onchange="changeLanguage()">
                        <option value="en">English</option>
                        <option value="hi">हिंदी</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span>🎨</span>
                    <select id="themeSelect" onchange="changeTheme()">
                        <option value="theme-dark">Abyss Dark</option>
                        <option value="theme-light">Glass Light</option>
                        <option value="theme-neon">Cyber Neon</option>
                    </select>
                </div>
            </div>
        </aside>

        <main class="main-workspace">
            
            <header class="workspace-header">
                <div class="mode-title-area">
                    <h1 id="workspace-title" data-en="Standard Deck" data-hi="साधारण डेक">Standard Deck</h1>
                    <p class="sub-status" data-en="Ready for expressions" data-hi="समीकरण के लिए तैयार">Ready for expressions</p>
                </div>
                <button id="voiceBtn" class="action-trigger-btn" onclick="startVoiceRecognition()" title="Voice Activation">
                    <span class="mic-wave">🎤</span>
                </button>
            </header>

            <section class="display-canvas">
                <div id="expression-preview" class="expr-line"></div>
                <div class="display-input-wrap">
                    <input type="text" id="main-display" value="0" readonly>
                    <button class="inline-copy-btn" onclick="copyResult()" title="Copy Code">📋</button>
                </div>
            </section>

            <section id="calc-pad" class="pad-layout-grid">
                <button class="btn sci-btn" onclick="inputSci('sin')">sin</button>
                <button class="btn sci-btn" onclick="inputSci('cos')">cos</button>
                <button class="btn sci-btn" onclick="inputSci('tan')">tan</button>
                <button class="btn sci-btn" onclick="inputSci('sqrt')">√</button>
                <button class="btn sci-btn" onclick="inputSci('log')">log</button>
                <button class="btn sci-btn" onclick="inputSci('ln')">ln</button>
                <button class="btn sci-btn" onclick="appendValue('**2')">x²</button>
                <button class="btn sci-btn" onclick="appendValue('π')">π</button>

                <button class="btn functional-btn" onclick="clearDisplay()">AC</button>
                <button class="btn functional-btn" onclick="appendValue('(')">(</button>
                <button class="btn functional-btn" onclick="appendValue(')')">)</button>
                <button class="btn operator-btn" onclick="backspace()">⌫</button>

                <button class="btn numeric-btn" onclick="appendValue('7')">7</button>
                <button class="btn numeric-btn" onclick="appendValue('8')">8</button>
                <button class="btn numeric-btn" onclick="appendValue('9')">9</button>
                <button class="btn operator-btn" onclick="appendValue('/')">÷</button>

                <button class="btn numeric-btn" onclick="appendValue('4')">4</button>
                <button class="btn numeric-btn" onclick="appendValue('5')">5</button>
                <button class="btn numeric-btn" onclick="appendValue('6')">6</button>
                <button class="btn operator-btn" onclick="appendValue('*')">×</button>

                <button class="btn numeric-btn" onclick="appendValue('1')">1</button>
                <button class="btn numeric-btn" onclick="appendValue('2')">2</button>
                <button class="btn numeric-btn" onclick="appendValue('3')">3</button>
                <button class="btn operator-btn" onclick="appendValue('-')">−</button>

                <button class="btn functional-btn" onclick="toggleSign()">+/-</button>
                <button class="btn numeric-btn" onclick="appendValue('0')">0</button>
                <button class="btn numeric-btn" onclick="appendValue('.')">.</button>
                <button class="btn operator-btn" onclick="appendValue('%')">%</button>
                
                <button class="btn execute-btn" onclick="calculate()" style="grid-column: span 4;">=</button>
            </section>

            <section id="unit-pad" class="dashboard-subview hidden">
                <div class="form-card">
                    <div class="input-field-block">
                        <label data-en="Dimension Category" data-hi="आयाम श्रेणी">Dimension Category</label>
                        <select id="unitCategory" onchange="updateUnitOptions()">
                            <option value="area" data-en="Area (Acres / m²)" data-hi="क्षेत्रफल (एकड़ / वर्ग मीटर)">Area (Acres / m²)</option>
                            <option value="length" data-en="Length (km / miles)" data-hi="लंबाई (किमी / मील)">Length (km / miles)</option>
                            <option value="temp" data-en="Temperature (°C / °F)" data-hi="तापमान (°C / °F)">Temperature (°C / °F)</option>
                        </select>
                    </div>
                    
                    <div class="split-input-row">
                        <div class="input-field-block">
                            <label data-en="Source Value" data-hi="स्रोत मान">Source Value</label>
                            <input type="number" id="unitInput" value="1" oninput="performUnitConversion()">
                            <select id="unitFrom" onchange="performUnitConversion()"></select>
                        </div>
                        <div class="conversion-vector">⚡</div>
                        <div class="input-field-block">
                            <label data-en="Target Output" data-hi="लक्षित परिणाम">Target Output</label>
                            <div class="read-only-result-plate" id="unitOutput">0.00</div>
                            <select id="unitTo" onchange="performUnitConversion()"></select>
                        </div>
                    </div>
                </div>
            </section>

            <section id="history-pad" class="dashboard-subview hidden">
                <div class="history-deck-frame">
                    <div class="deck-top-actions">
                        <h4 data-en="Previous Calculations" data-hi="पिछले समीकरण">Previous Calculations</h4>
                        <button class="flush-cache-btn" onclick="clearHistory()" data-en="Flush Records" data-hi="रिकॉर्ड हटाएं">Flush Records</button>
                    </div>
                    <div id="history-list" class="scrolling-deck-body">
                        </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
